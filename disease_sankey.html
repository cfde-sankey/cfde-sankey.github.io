        <script type="text/javascript">
            const PLOT_ID = "cd5db974-d0ce-4009-b514-76faa8c620b1";
            const COL = { prog: "program", disease: "disease and doid", domain: "disease domain" };
            const PROGRAM_LABELS = {};

            const statusEl = document.getElementById("data-status");
            const notesEl = document.getElementById("data-notes");
            function setStatus(text, isError) {
                statusEl.textContent = text;
                statusEl.className = isError ? "error" : "";
            }
            function setNotes(lines) {
                notesEl.innerHTML = "";
                lines.forEach(t => { const d = document.createElement("div"); d.textContent = t; notesEl.appendChild(d); });
            }

            function parseAndRender(csvText, sourceName) {
                const parsed = Papa.parse(csvText.replace(/^﻿/, ""), {
                    header: true,
                    skipEmptyLines: "greedy",
                    transformHeader: h => h.trim().toLowerCase(),
                    transform: v => (v == null ? "" : String(v).trim())
                });
                if (parsed.errors.length) console.warn("CSV parse warnings:", parsed.errors);
                const fields = parsed.meta.fields || [];
                const required = [COL.prog, COL.disease, COL.domain];
                const missing = required.filter(c => !fields.includes(c));
                if (missing.length) {
                    setStatus(`${sourceName}: missing column(s) ${missing.join(", ")}. Found: ${fields.join(", ")}`, true);
                    return;
                }
                const notes = render(parsed.data);
                setNotes(notes);
                // setStatus(`Showing ${sourceName} (${parsed.data.length.toLocaleString()} rows)`, false);
            }

            const embeddedCsv = document.getElementById("embedded-csv").textContent.trim();
            if (embeddedCsv) {
                window.addEventListener("DOMContentLoaded", () => parseAndRender(embeddedCsv, "embedded data"));
            } else {
                setStatus("No CSV is embedded in this page. Paste the CSV text into the page source, between the script tags marked PASTE YOUR CSV HERE.", true);
            }
            const LAYOUT = [
                { title: "16 CFDE Programs",      x: 0.005 },
                { title: "Disease (DOID)",   x: 0.27 },
                { title: "Phenotype",     x: 0.72 }
            ];

            function tidy(raw) {
                return (raw || "").replace(/^[*\s]+/, "").replace(/\s+/g, " ").replace(/\b(DOID|SCTID):\s+/gi, (m, p) => p.toUpperCase() + ":").trim();
            }
            function splitDisease(text) {
                const m = text.match(/^((?:DOID|SCTID):\d+)\s*(.*)$/i);
                return m ? { id: m[1].toUpperCase(), name: m[2] } : { id: "", name: text };
            }
            function domainLabel(raw) {
                const t = tidy(raw);
                return t ? t.charAt(0).toUpperCase() + t.slice(1).toLowerCase() : "";
            }

            function render(data) {
                const notes = [];
                const programs = [];
                const progSeen = new Set();
                const diseases = new Map();   // key -> { label, progs:Set, domains:Set }
                const domains = new Map();    // key -> { label, diseases:Set, progs:Set }
                const progDisease = new Set();
                const diseaseDomain = new Set();
                const noId = [];

                data.forEach(row => {
                    const prog = row[COL.prog];
                    const label = tidy(row[COL.disease]);
                    if (!prog || !label) return;
                    if (!progSeen.has(prog)) { progSeen.add(prog); programs.push(prog); }
                    const parts = splitDisease(label);
                    if (!parts.id) noId.push(`${prog}: ${label}`);
                    const dKey = label.toLowerCase();
                    if (!diseases.has(dKey)) diseases.set(dKey, { label, name: parts.name, id: parts.id, progs: new Set(), domains: new Set() });
                    const dis = diseases.get(dKey);
                    dis.progs.add(prog);
                    progDisease.add(prog + "\u0001" + dKey);

                    const domLabel = domainLabel(row[COL.domain]);
                    if (domLabel) {
                        const mKey = domLabel.toLowerCase();
                        if (!domains.has(mKey)) domains.set(mKey, { label: domLabel, diseases: new Set(), progs: new Set() });
                        domains.get(mKey).diseases.add(dKey);
                        domains.get(mKey).progs.add(prog);
                        dis.domains.add(domLabel);
                        diseaseDomain.add(dKey + "\u0001" + mKey);
                    }
                });

                // Data checks shown above the diagram
                const byName = new Map();
                diseases.forEach(d => {
                    if (!d.id) return;
                    const k = d.name.toLowerCase();
                    if (!byName.has(k)) byName.set(k, []);
                    byName.get(k).push(d.id);
                });
                byName.forEach((ids, k) => { if (ids.length > 1) notes.push(`Check data: "${k}" appears with different IDs (${ids.join(", ")}).`); });
                if (noId.length) notes.push(`No DOID given for: ${noId.join("; ")}.`);

                const az = (a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true });
                const rank = name => { const n = name.trim().toLowerCase(); return n === "healthy" ? 0 : n === "aging" ? 2 : 1; };
                const diseaseList = [...diseases.entries()].map(([key, d]) => ({ key, ...d }))
                    .sort((a, b) => rank(a.name) - rank(b.name) || az(a.name, b.name) || az(a.label, b.label));
                const domainList = [...domains.entries()].map(([key, m]) => ({ key, ...m }))
                    .sort((a, b) => rank(a.label) - rank(b.label) || az(a.label, b.label));

                const yStart = 0.0125;
                const baseInc = 0.5;
                const span = Math.max(diseaseList.length, domainList.length, programs.length) * baseInc;
                const cols = [
                    { n: programs.length },
                    { n: diseaseList.length },
                    { n: domainList.length }
                ];
                const rawY = [];
                cols.forEach(c => { const inc = c.n > 0 ? span / c.n : baseInc; for (let i = 0; i < c.n; i++) rawY.push(yStart + i * inc); });
                const maxY = Math.max(...rawY);
                const padding = 0.05;
                const scale = (1 - 2 * padding) / maxY;

                const nodeIndex = new Map();
                const nodesArr = [];
                let k = 0;
                programs.forEach(p => { nodeIndex.set("p::" + p, nodesArr.length); nodesArr.push({ label: PROGRAM_LABELS[p] || p, x: LAYOUT[0].x, y: padding + rawY[k++] * scale,
                    hover: `${PROGRAM_LABELS[p] || p}<br>${[...diseases.values()].filter(d => d.progs.has(p)).length} disease entries` }); });
                diseaseList.forEach(d => { nodeIndex.set("d::" + d.key, nodesArr.length); nodesArr.push({ label: d.label, x: LAYOUT[1].x, y: padding + rawY[k++] * scale,
                    hover: `${d.label}<br>Programs: ${[...d.progs].join(", ")}<br>Domain: ${[...d.domains].join(", ") || "none"}` }); });
                domainList.forEach(m => { nodeIndex.set("m::" + m.key, nodesArr.length); nodesArr.push({ label: m.label, x: LAYOUT[2].x, y: padding + rawY[k++] * scale,
                    hover: `${m.label}<br>${m.diseases.size} disease${m.diseases.size === 1 ? "" : "s"}<br>Programs: ${[...m.progs].join(", ")}` }); });

                const links = [];
                progDisease.forEach(e => { const [p, dk] = e.split("\u0001"); links.push([nodeIndex.get("p::" + p), nodeIndex.get("d::" + dk)]); });
                diseaseDomain.forEach(e => { const [dk, mk] = e.split("\u0001"); links.push([nodeIndex.get("d::" + dk), nodeIndex.get("m::" + mk)]); });

                const height = Math.max(1000, diseaseList.length * 38 + 200);
                document.getElementById(PLOT_ID).style.height = height + "px";

                const columnTitleOffset = -0.005;
                const config = {
                    responsive: true,
                    toImageButtonOptions: { format: "svg", filename: "cfde_disease_sankey", height: 1500, width: 1500, scale: 1 }
                };

                window.PLOTLYENV = window.PLOTLYENV || {};
                Plotly.react(
                    PLOT_ID,
                    [
                        {
                            link: {
                                source: [0].concat(links.map(l => l[0] + 2)),
                                target: [1].concat(links.map(l => l[1] + 2)),
                                value: [0.0000001].concat(Array(links.length).fill(0.1))
                            },
                            node: {
                                label: ["", ""].concat(nodesArr.map(n => n.label)),
                                line: { color: "gray", width: 0.5 },
                                pad: 50,
                                thickness: 20,
                                x: [0.99, 0.99].concat(nodesArr.map(n => n.x)),
                                y: [99, 99].concat(nodesArr.map(n => n.y)),
                                customdata: ["", ""].concat(nodesArr.map(n => n.hover)),
