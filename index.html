<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CFDE Program Sankey Diagrams</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font-family: sans-serif; color: #2a3f5f; background: #fff; }
        [role="tablist"] { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid #c8d4e3; background: #f5f8fc; }
        [role="tab"] {
            font: inherit; font-size: 14px; color: #2a3f5f; background: transparent;
            border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0;
            padding: 9px 18px; cursor: pointer; margin-bottom: -1px;
        }
        [role="tab"]:hover { background: #e5ecf6; }
        [role="tab"][aria-selected="true"] { background: #fff; border-color: #c8d4e3; font-weight: bold; }
        [role="tab"]:focus-visible { outline: 2px solid #4e79a7; outline-offset: -2px; }
        [role="tabpanel"] { flex: 1; min-height: 0; }
        [role="tabpanel"][hidden] { display: none; }
        iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
</head>

<body>
    <div role="tablist" aria-label="Sankey diagrams">
        <button role="tab" id="tab-assets" aria-selected="true" aria-controls="panel-assets">Digital Assets and Repositories</button>
        <button role="tab" id="tab-disease" aria-selected="false" aria-controls="panel-disease" tabindex="-1">Programs and Diseases</button>
    </div>

    <!-- Each diagram is its own page. The second one loads on first click, so
         Plotly draws it at full size instead of inside a hidden frame. -->
    <div role="tabpanel" id="panel-assets" aria-labelledby="tab-assets">
        <iframe src="repository_sankey.html" title="CFDE Datasets and Their Potential Host Repositories"></iframe>
    </div>
    <div role="tabpanel" id="panel-disease" aria-labelledby="tab-disease" hidden>
        <iframe data-src="disease_sankey.html" title="CFDE Program Datasets and Their Human Disease Ontology"></iframe>
    </div>

    <script>
        const tabs = [...document.querySelectorAll('[role="tab"]')];
        function select(tab) {
            tabs.forEach(t => {
                const on = t === tab;
                t.setAttribute("aria-selected", on);
                t.tabIndex = on ? 0 : -1;
                document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
            });
            const frame = document.getElementById(tab.getAttribute("aria-controls")).querySelector("iframe");
            if (frame.dataset.src) { frame.src = frame.dataset.src; delete frame.dataset.src; }
            try { history.replaceState(null, "", "#" + tab.id.replace("tab-", "")); } catch (e) {}
        }
        tabs.forEach((t, i) => {
            t.addEventListener("click", () => select(t));
            t.addEventListener("keydown", e => {
                const n = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
                if (n) { const next = tabs[(i + n + tabs.length) % tabs.length]; next.focus(); select(next); }
            });
        });
        const start = tabs.find(t => "#" + t.id.replace("tab-", "") === location.hash);
        if (start) select(start);
    </script>
</body>

</html>
